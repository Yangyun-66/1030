<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8f6" />
  <title>日常｜行程與任務</title>
  <style>
    :root{--ink:#202b2a;--muted:#7d8985;--line:#e8ece8;--paper:#fff;--bg:#f7f8f6;--green:#285c4d;--mint:#e9f3ed;--orange:#d97749;--blue:#6788b5;--shadow:0 12px 35px #23382b0b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;min-height:100vh;display:grid;grid-template-columns:226px minmax(0,1fr);gap:28px;padding:26px 30px}
    aside{display:flex;flex-direction:column;min-height:calc(100vh - 52px)}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:750;letter-spacing:.02em;margin:8px 0 42px}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:white;font-size:18px}
    .nav-label{font-size:11px;letter-spacing:.12em;color:#a1aaa6;font-weight:700;margin:0 0 12px 12px}.nav{display:grid;gap:6px}.nav button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:11px;color:#707d78;display:flex;align-items:center;gap:13px}.nav button.active{background:var(--mint);color:var(--green);font-weight:650}.nav .ico{width:19px;text-align:center;font-size:17px}.sidebar-bottom{margin-top:auto}.mini-note{border-radius:15px;background:#edf3ef;padding:16px;color:#486458;font-size:13px}.mini-note strong{display:block;color:#2c5949;margin:0 0 5px}.profile{display:flex;align-items:center;gap:10px;margin:23px 7px 0;font-size:13px}.avatar{height:32px;width:32px;border-radius:50%;background:#d9e6de;display:grid;place-items:center;color:var(--green);font-weight:700}.profile small{display:block;color:var(--muted)}
    main{min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 25px}.date-overline{font-size:12px;color:var(--muted);letter-spacing:.06em}.hello{font-size:25px;font-weight:730;letter-spacing:-.03em;margin-top:2px}.hello span{color:#9aa7a0}.top-actions{display:flex;align-items:center;gap:11px}.icon-btn,.outline-btn{border:1px solid var(--line);background:var(--paper);border-radius:11px;height:42px;min-width:42px;color:#65736d;position:relative}.badge{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--orange);border-radius:50%;border:1px solid white}.primary{background:var(--green);color:white;border:0;border-radius:11px;height:42px;padding:0 16px;font-weight:650;box-shadow:0 4px 10px #285c4d20}.primary:hover{background:#204c40}.grid{display:grid;grid-template-columns:minmax(340px,1.32fr) minmax(310px,.88fr);gap:22px;align-items:start}.column{display:grid;gap:20px;min-width:0}.card{background:var(--paper);border:1px solid #edf0ec;border-radius:17px;box-shadow:var(--shadow);padding:21px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.card-title{font-weight:720;font-size:16px}.subtle{font-size:12px;color:var(--muted)}.link-btn{background:none;border:0;color:var(--green);font-weight:650;font-size:12px;padding:4px}
    .day-switch{display:flex;align-items:center;gap:14px}.day-switch button,.month-switch button{border:0;background:none;color:#8d9993;padding:3px 7px;font-size:18px}.day-name{font-size:12px;color:var(--muted)}.day-date{font-size:18px;font-weight:720;margin-left:5px}.progress-wrap{display:flex;align-items:center;gap:9px}.progress{height:5px;width:74px;background:#edf0ed;border-radius:5px;overflow:hidden}.progress i{height:100%;display:block;background:#6c9b7e;border-radius:5px;width:58%}.progress-label{font-size:11px;color:var(--muted)}
    .reminder{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:#fff6ee;border:1px solid #fae8d7;margin-bottom:12px}.reminder-mark{width:27px;height:27px;border-radius:9px;background:#fbe4d3;color:#bf673b;display:grid;place-items:center;flex:none}.reminder strong{display:block;font-size:13px}.reminder p{margin:2px 0 0;font-size:12px;color:#927b6c}.reminder-close{margin-left:auto;border:0;background:none;color:#aa988b;font-size:17px;align-self:flex-start}
    .list{display:grid}.item{display:grid;grid-template-columns:54px 18px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:61px;border-bottom:1px solid #f0f2ef}.item:last-child{border-bottom:0}.time{font-size:11px;color:#8c9892}.check{appearance:none;width:17px;height:17px;border:1.5px solid #ccd5cf;border-radius:50%;cursor:pointer;position:relative}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';position:absolute;color:white;font-size:11px;left:2px;top:-1px}.item-title{font-size:13px;font-weight:610}.item-meta{font-size:11px;color:var(--muted);margin-top:3px}.tag{padding:4px 8px;border-radius:7px;font-size:10px;white-space:nowrap}.tag.event{color:#5675a2;background:#edf2fa}.tag.task{color:#a5663e;background:#fff1e7}.tag.done{color:#5a8267;background:#eff6f0}.priority{font-size:10px;color:#c5794b;margin-right:4px}.item-actions{display:flex;align-items:center;gap:5px}.delete-btn{border:0;background:transparent;color:#9aa59f;border-radius:7px;width:27px;height:27px;font-size:16px;line-height:1}.delete-btn:hover,.delete-btn:focus-visible{background:#fff0ed;color:#b94c3e;outline:none}
    .habits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.habit{border:1px solid #edf0ec;border-radius:12px;padding:12px 10px;min-height:91px;display:flex;flex-direction:column;justify-content:space-between}.habit-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;font-weight:620}.habit-icon{font-size:17px}.habit input{accent-color:var(--green);width:16px;height:16px;margin:0}.habit small{font-size:10px;color:var(--muted)}
    .calendar-card{padding:21px 19px}.month-title{font-size:16px;font-weight:720}.month-switch{display:flex;align-items:center;gap:10px}.month-switch button{font-size:16px}.month-switch span{font-size:12px;color:var(--muted)}.calendar{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}.calendar th{font-size:10px;color:#a1aaa6;font-weight:600;padding:5px 0 8px}.calendar td{height:59px;vertical-align:top;border-radius:9px;padding:5px 4px;cursor:pointer;position:relative}.calendar td:hover{background:#f6f8f6}.calendar td.muted{opacity:.35}.calendar td.selected{background:var(--mint)}.calendar td.today .num{background:var(--green);color:white}.num{height:22px;width:22px;display:grid;place-items:center;border-radius:50%;font-size:11px;margin:0 auto 3px}.dots{display:flex;justify-content:center;gap:3px}.dots i{width:4px;height:4px;background:#83a990;border-radius:50%}.dots i.taskdot{background:#e5a276}.day-preview{margin:13px 2px 0;padding-top:12px;border-top:1px solid var(--line)}.preview-head{display:flex;justify-content:space-between;font-size:12px;font-weight:650;margin-bottom:8px}.preview-lines{display:grid;gap:6px}.preview-line{font-size:11px;color:#63716b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-line b{font-weight:600;color:#9aaba2;margin-right:6px}
    .week{display:flex;gap:5px;margin-top:12px}.week span{width:18px;height:18px;border-radius:6px;background:#edf3ee}.week span.on{background:#77a185}.week span.today{outline:2px solid #dce9df;outline-offset:1px}.streak{font-size:10px;color:#789080;margin-top:7px}
    .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#263d34;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 25px #0002;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    dialog{border:0;border-radius:18px;padding:0;width:min(430px,calc(100% - 28px));box-shadow:0 22px 80px #18251e38;color:var(--ink)}dialog::backdrop{background:#1c29244c;backdrop-filter:blur(2px)}.modal{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head strong{font-size:18px}.modal-head button{border:0;background:none;color:#718078;font-size:21px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:#6f7b75;font-weight:600}.field input,.field select{height:42px;border:1px solid #e4e9e4;background:white;border-radius:9px;padding:0 11px;color:var(--ink);outline-color:#9fbaa7}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.cancel{height:40px;border:1px solid var(--line);border-radius:10px;background:white;padding:0 14px;color:#65736d}
    @media(max-width:980px){.app{grid-template-columns:70px minmax(0,1fr);padding:20px;gap:19px}.brand{justify-content:center;margin:5px 0 38px}.brand-name,.nav-label,.nav-text,.mini-note,.profile-info{display:none}.nav button{justify-content:center;padding:12px 0}.nav .ico{font-size:19px}.profile{justify-content:center;margin-inline:0}.grid{grid-template-columns:minmax(0,1fr) minmax(290px,.85fr)}}
    @media(max-width:700px){.app{display:block;padding:15px 14px 86px}.app aside{position:fixed;z-index:4;bottom:0;left:0;right:0;height:65px;min-height:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:block;padding:5px 11px}.brand,.nav-label,.sidebar-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{width:56px;padding:7px 2px;display:grid;justify-items:center;gap:1px;font-size:9px}.nav .ico{font-size:17px}.nav-text{display:block}.topbar{margin:4px 2px 19px}.hello{font-size:22px}.top-actions{gap:7px}.primary{padding:0 11px;font-size:12px;height:39px}.icon-btn{height:39px;min-width:39px}.grid{display:flex;flex-direction:column;gap:15px}.column{display:contents}.today-card{order:1}.calendar-card{order:2}.habits-card{order:3}.card{padding:17px;border-radius:15px}.calendar-card{padding:17px 14px}.calendar td{height:52px}.habits{grid-template-columns:repeat(3,1fr)}.item{grid-template-columns:46px 17px minmax(0,1fr) auto;gap:7px}.tag{font-size:9px;padding:4px 6px}}
    @media(max-width:380px){.item{grid-template-columns:39px 16px minmax(0,1fr)}.item>.item-actions>.tag{display:none}.habits{gap:6px}.habit{padding:10px 8px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="brand-mark">日</div><span class="brand-name">日常</span></div>
    <div class="nav-label">工作區</div>
    <nav class="nav" aria-label="主要導覽">
      <button class="active" data-view="today"><span class="ico">▦</span><span class="nav-text">今日</span></button>
      <button data-view="calendar"><span class="ico">▣</span><span class="nav-text">月曆</span></button>
      <button data-view="habits"><span class="ico">◉</span><span class="nav-text">習慣</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="mini-note"><strong>今天，慢慢來 🌿</strong>完成一件重要的事<br>就很不錯了。</div><div class="profile"><div class="avatar">J</div><div class="profile-info">Jelena<small>個人空間</small></div></div></div>
  </aside>
  <main>
    <header class="topbar"><div><div class="date-overline" id="fullDate">星期五・2026 年 10 月 30 日</div><div class="hello">早安，Jelena <span>☀</span></div></div><div class="top-actions"><button class="icon-btn" id="bell" aria-label="查看提醒">♧<i class="badge"></i></button><button class="primary" id="addBtn">＋ 新增項目</button></div></header>
    <div class="grid">
      <section class="column">
        <article class="card today-card" id="todayCard">
          <div class="card-head"><div class="day-switch"><button id="prevDay" aria-label="前一天">‹</button><div><span class="day-name" id="dayName">星期五</span><span class="day-date" id="dayDate">10 月 30 日</span></div><button id="nextDay" aria-label="後一天">›</button></div><div class="progress-wrap"><div class="progress"><i id="progressBar"></i></div><span class="progress-label" id="progressLabel">2 / 5 完成</span></div></div>
          <div id="reminderBox" class="reminder"><div class="reminder-mark">◷</div><div><strong>提醒｜下午記得補充水分</strong><p>喝杯水，讓自己休息一下。</p></div><button class="reminder-close" id="closeReminder" aria-label="關閉提醒">×</button></div>
          <div class="list" id="itemList"></div>
          <div style="text-align:center;padding-top:10px"><button class="link-btn" id="addTaskInline">＋ 新增待辦任務</button></div>
        </article>
        <article class="card habits-card" id="habitsCard"><div class="card-head"><div><div class="card-title">每日習慣</div><div class="subtle" style="margin-top:3px">小小累積，也是一種前進</div></div><button class="link-btn" id="habitLink">查看紀錄 →</button></div><div class="habits" id="habitList"></div></article>
      </section>
      <section class="column">
        <article class="card calendar-card" id="calendarCard"><div class="card-head"><div class="month-title" id="monthTitle">2026 年 10 月</div><div class="month-switch"><button id="prevMonth" aria-label="上個月">‹</button><button id="nextMonth" aria-label="下個月">›</button><span id="todayJump">今天</span></div></div><table class="calendar" aria-label="月曆"><thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead><tbody id="calendarBody"></tbody></table><div class="day-preview"><div class="preview-head"><span id="previewDate">10 月 30 日・今日</span><span id="previewCount" class="subtle">3 項</span></div><div class="preview-lines" id="previewLines"></div></div></article>
        <article class="card"><div class="card-head" style="margin:0"><div><div class="card-title">習慣連續紀錄</div><div class="subtle" style="margin-top:3px">每天一點點，成為日常</div></div><div style="font-size:23px">🌱</div></div><div class="week" id="weekDots"></div><div class="streak">本週已完成 <strong id="weekCount">4</strong> 天</div></article>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="addDialog"><form class="modal" id="itemForm"><div class="modal-head"><strong>新增項目</strong><button type="button" id="closeDialog" aria-label="關閉">×</button></div><div class="field"><label for="itemTitle">項目名稱</label><input id="itemTitle" required placeholder="例如：準備簡報" /></div><div class="two-fields"><div class="field"><label for="itemType">類型</label><select id="itemType"><option value="task">待辦任務</option><option value="event">固定行程</option></select></div><div class="field"><label for="itemDate">日期</label><input id="itemDate" type="date" required /></div></div><div class="two-fields"><div class="field"><label for="itemTime">時間</label><input id="itemTime" type="time" value="10:00" /></div><div class="field"><label for="itemPriority">優先順序</label><select id="itemPriority"><option value="一般">一般</option><option value="高">高</option><option value="低">低</option></select></div></div><div class="field"><label for="itemReminder">頁面提醒</label><select id="itemReminder"><option value="none">不設定提醒</option><option value="at">在項目開始時提醒</option></select></div><div class="modal-actions"><button type="button" class="cancel" id="cancelDialog">取消</button><button class="primary" type="submit">加入清單</button></div></form></dialog>
<script>
  const today = new Date(2026,9,30); today.setHours(0,0,0,0);
  let selected = new Date(today), viewed = new Date(today);
  const keyDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const dateFrom = s => {const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const weekday = d => '日一二三四五六'[d.getDay()];
  const fmtDay = d => `${d.getMonth()+1} 月 ${d.getDate()} 日`;
  const same = (a,b)=>keyDate(a)===keyDate(b);
  let items = [
    {id:1,date:'2026-10-30',time:'09:00',title:'晨間伸展與閱讀',type:'task',done:true,priority:'一般'},
    {id:2,date:'2026-10-30',time:'10:30',title:'產品設計週會',type:'event',done:false,priority:'一般'},
    {id:3,date:'2026-10-30',time:'13:00',title:'完成首頁線框稿',type:'task',done:false,priority:'高'},
    {id:4,date:'2026-10-30',time:'15:30',title:'和怡君喝咖啡',type:'event',done:false,priority:'一般'},
    {id:5,date:'2026-10-30',time:'17:00',title:'整理本週工作筆記',type:'task',done:true,priority:'低'},
    {id:6,date:'2026-10-31',time:'11:00',title:'採買週末食材',type:'task',done:false,priority:'一般'},
    {id:7,date:'2026-11-02',time:'09:30',title:'牙醫回診',type:'event',done:false,priority:'一般'},
    {id:8,date:'2026-11-02',time:'14:00',title:'提交專案提案',type:'task',done:false,priority:'高'},
    {id:9,date:'2026-11-06',time:'18:30',title:'晚餐｜家人聚會',type:'event',done:false,priority:'一般'},
    {id:10,date:'2026-10-28',time:'16:00',title:'寄出會議摘要',type:'task',done:true,priority:'一般'},
  ];
  let habits=[{name:'喝足 8 杯水',icon:'💧',done:true,streak:'連續 5 天'},{name:'閱讀 20 分鐘',icon:'📖',done:false,streak:'連續 3 天'},{name:'伸展運動',icon:'🧘',done:true,streak:'連續 2 天'}];
  const $=s=>document.querySelector(s); const $$=s=>document.querySelectorAll(s);
  const toast=(msg)=>{const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2200)};
  function renderHeader(){ $('#fullDate').textContent=`星期${weekday(today)}・${today.getFullYear()} 年 ${today.getMonth()+1} 月 ${today.getDate()} 日`; $('#dayName').textContent=`星期${weekday(selected)}`;$('#dayDate').textContent=fmtDay(selected); }
  function renderItems(){const list=items.filter(x=>x.date===keyDate(selected)).sort((a,b)=>a.time.localeCompare(b.time));$('#itemList').innerHTML=list.map(x=>`<div class="item"><span class="time">${x.time}</span><input class="check" type="checkbox" data-id="${x.id}" ${x.done?'checked':''} aria-label="完成${x.title}"><div><div class="item-title">${x.priority==='高'&&!x.done?'<span class="priority">▲ 高</span>':''}${x.title}</div><div class="item-meta">${x.type==='event'?'行程':'待辦任務'}${x.type==='task'?'・截止 '+fmtDay(dateFrom(x.date)):''}</div></div><div class="item-actions"><span class="tag ${x.type}">${x.type==='event'?'行程':'任務'}</span><button class="delete-btn" data-delete="${x.id}" aria-label="刪除${x.title}" title="刪除">×</button></div></div>`).join('')||'<div class="subtle" style="text-align:center;padding:24px">今天還沒有安排，留一點空白也很好 🌿</div>';const done=list.filter(x=>x.done).length;$('#progressLabel').textContent=`${done} / ${list.length} 完成`;$('#progressBar').style.width=list.length?`${done/list.length*100}%`:'0%';$$('.check').forEach(c=>c.addEventListener('change',()=>{const item=items.find(x=>x.id==c.dataset.id);item.done=c.checked;renderItems();renderCalendar();toast(c.checked?'已完成，做得好！':'已恢復為未完成')}));$$('[data-delete]').forEach(b=>b.addEventListener('click',()=>{const item=items.find(x=>x.id==b.dataset.delete);if(item&&confirm(`確定要刪除「${item.title}」嗎？`)){items=items.filter(x=>x.id!==item.id);renderItems();renderCalendar();toast('項目已刪除')}}));renderCalendar(); }
  function renderCalendar(){const y=viewed.getFullYear(),m=viewed.getMonth();$('#monthTitle').textContent=`${y} 年 ${m+1} 月`;const first=new Date(y,m,1),offset=first.getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();let html='';for(let r=0;r<6;r++){html+='<tr>';for(let c=0;c<7;c++){let ix=r*7+c-offset+1,d,muted=false;if(ix<1){d=new Date(y,m-1,prevDays+ix);muted=true}else if(ix>days){d=new Date(y,m+1,ix-days);muted=true}else d=new Date(y,m,ix);const key=keyDate(d),dayitems=items.filter(x=>x.date===key),classes=[muted?'muted':'',same(d,today)?'today':'',same(d,selected)?'selected':''].join(' ');html+=`<td class="${classes}" data-date="${key}"><span class="num">${d.getDate()}</span><span class="dots">${dayitems.slice(0,3).map(x=>`<i class="${x.type==='task'?'taskdot':''}"></i>`).join('')}</span></td>`}html+='</tr>';if(r===4&&offset+days<=35)break}$('#calendarBody').innerHTML=html;$$('#calendarBody td').forEach(td=>td.addEventListener('click',()=>{selected=dateFrom(td.dataset.date);viewed=new Date(selected);render();}));const preview=items.filter(x=>x.date===keyDate(selected)).sort((a,b)=>a.time.localeCompare(b.time));$('#previewDate').textContent=`${fmtDay(selected)}${same(selected,today)?'・今日':''}`;$('#previewCount').textContent=`${preview.length} 項`;$('#previewLines').innerHTML=preview.slice(0,3).map(x=>`<div class="preview-line"><b>${x.time}</b>${x.title}</div>`).join('')||'<div class="preview-line">尚無安排</div>';}
  function renderHabits(){ $('#habitList').innerHTML=habits.map((h,i)=>`<div class="habit"><div class="habit-top"><span>${h.name}</span><span class="habit-icon">${h.icon}</span></div><div style="display:flex;align-items:center;justify-content:space-between"><small>${h.streak}</small><input type="checkbox" data-habit="${i}" ${h.done?'checked':''} aria-label="${h.name}完成"></div></div>`).join('');$$('[data-habit]').forEach(c=>c.addEventListener('change',()=>{habits[+c.dataset.habit].done=c.checked;renderHabits();toast(c.checked?'習慣已打卡 🌱':'已取消打卡')}));$('#weekCount').textContent=habits.filter(h=>h.done).length+2;}
  function render(){renderHeader();renderItems();renderHabits();}
  $('#prevDay').onclick=()=>{selected.setDate(selected.getDate()-1);viewed=new Date(selected);render()};$('#nextDay').onclick=()=>{selected.setDate(selected.getDate()+1);viewed=new Date(selected);render()};$('#prevMonth').onclick=()=>{viewed.setMonth(viewed.getMonth()-1);renderCalendar()};$('#nextMonth').onclick=()=>{viewed.setMonth(viewed.getMonth()+1);renderCalendar()};$('#todayJump').onclick=()=>{selected=new Date(today);viewed=new Date(today);render()};
  const dialog=$('#addDialog');function openDialog(){ $('#itemDate').value=keyDate(selected);dialog.showModal();$('#itemTitle').focus() }$('#addBtn').onclick=openDialog;$('#addTaskInline').onclick=openDialog;$('#closeDialog').onclick=()=>dialog.close();$('#cancelDialog').onclick=()=>dialog.close();$('#itemForm').addEventListener('submit',e=>{e.preventDefault();items.push({id:Date.now(),title:$('#itemTitle').value.trim(),type:$('#itemType').value,date:$('#itemDate').value,time:$('#itemTime').value||'09:00',priority:$('#itemPriority').value,done:false});selected=dateFrom($('#itemDate').value);viewed=new Date(selected);dialog.close();e.target.reset();$('#itemTime').value='10:00';render();toast('已加入今日安排')});
  $('#closeReminder').onclick=()=>$('#reminderBox').remove();$('#bell').onclick=()=>{const box=$('#reminderBox');if(box){box.scrollIntoView({behavior:'smooth',block:'center'});box.style.outline='2px solid #f3c59d';setTimeout(()=>box.style.outline='',900)}else toast('目前沒有新的提醒')};$('#habitLink').onclick=()=>toast('這裡可以查看每日習慣紀錄');$$('.nav button').forEach(b=>b.onclick=()=>{ $$('.nav button').forEach(n=>n.classList.remove('active'));b.classList.add('active');const target=b.dataset.view==='calendar'?'calendarCard':b.dataset.view==='habits'?'habitsCard':'todayCard';document.getElementById(target).scrollIntoView({behavior:'smooth',block:'start'})});
  $('#weekDots').innerHTML=Array.from({length:7},(_,i)=>`<span class="${i<4?'on':''} ${i===5?'today':''}"></span>`).join('');render();
</script>
